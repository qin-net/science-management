[project]
name = "researchos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pypdfium2>=5.14.0",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pgserver>=0.1.4",
    "pillow>=11.0.0",
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311", "S608"]
"migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["researchos"]
ignore_missing_imports = true
# docling_runner runs in its own environment, where docling types exist.
exclude = ["docling_runner\\.py$"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
